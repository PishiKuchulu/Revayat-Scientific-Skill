name: WinSec only (fork experiment)
on:
  workflow_dispatch:
    inputs:
      runner:
        description: Windows runner image
        required: true
        default: windows-2025
        type: choice
        options:
          - windows-2025
          - windows-2022
permissions:
  contents: read
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
jobs:
  windows-security:
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 40
    env:
      CARGO_BUILD_JOBS: '2'
      RUST_TEST_THREADS: '1'
      RUSTFLAGS: '-D warnings -C target-feature=+crt-static'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30 # v2.0.1
      - name: Format native Windows security authority
        run: cargo fmt --all -- --check
      - name: Lint native Windows security authority
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Build complete Windows executables before containment tests
        run: cargo build --locked --workspace --all-targets
      - name: TEMP-DIAG kernel32 identity
        shell: pwsh
        run: |
          $p = "$env:SystemRoot\System32\kernel32.dll"
          $bytes = [System.IO.File]::ReadAllBytes($p)
          $pe = [BitConverter]::ToUInt32($bytes, 0x3C)
          $ts = [BitConverter]::ToUInt32($bytes, $pe + 8)
          $img = [BitConverter]::ToUInt32($bytes, $pe + 24 + 56)
          $sha = (Get-FileHash $p -Algorithm SHA256).Hash.ToLower()
          Write-Host "KERNEL32-IDENTITY sha256=$sha pe_timestamp=$ts image_size=$img file_size=$($bytes.Length)"
      - name: Run ordered Windows validators, kernel controls and forced wall-tree
        run: target/debug/revayat-scientific security-windows --authority-image target/debug/registry-authority.exe --bootstrap-checks --machine-kernel
      - name: Collect actual native Windows harness outcomes
        if: ${{ always() && !cancelled() }}
        run: target/debug/revayat-test-runner --tier native --profile debug --ignored --output execution/native-debug.json --timeout 1200
      - name: Retain independent Rust registry and native contracts
        if: ${{ always() && !cancelled() }}
        run: cargo test --locked --workspace --all-targets --no-fail-fast -- --test-threads=1
      - name: Preserve native Windows outcomes including case failures
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: execution-native-windows
          if-no-files-found: error
          path: execution/*.json
